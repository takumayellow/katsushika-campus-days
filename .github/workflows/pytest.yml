name: pytest

# Blender (bpy) と Unity を使わない純 Python のテスト (#68)。
# bpy / bmesh / mathutils は blender/tests/stubs.py の差し替えで読み込む。
on:
  push:
    paths:
      - "blender/**"
      - "tools/**"
      - "tests/**"
      - "data/osm/**"
      - "unity/KatsushikaCampusDays/Assets/Audio/SE/se_chime.wav"
      - "pytest.ini"
      - "requirements-test.txt"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "blender/**"
      - "tools/**"
      - "tests/**"
      - "data/osm/**"
      - "unity/KatsushikaCampusDays/Assets/Audio/SE/se_chime.wav"
      - "pytest.ini"
      - "requirements-test.txt"
      - ".github/workflows/pytest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install
        run: python -m pip install -r requirements-test.txt

      - name: Test
        run: python -m pytest -q
