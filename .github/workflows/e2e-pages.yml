name: E2E smoke of GitHub Pages

# Pages へ配信したあと、公開 URL をブラウザで開いて、読み込み・Build/ の応答・コンソールのエラー・
# キャンバスの描画・Enter でキャラ選択に進むところまでを確かめる (#69)。
# GitHub のランナーには GPU が無いので、Chromium の SwiftShader（CPU 描画）で走らせる。
# 実 GPU でキャンパスに入るまでの確認は、手元で python e2e/run_webgl_smoke.py を回す。
on:
  workflow_run:
    workflows: ["Deploy WebGL to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: "開く URL（空なら公開版）"
        required: false
        default: ""
      until:
        description: "どこまで進めるか"
        type: choice
        options: [select, campus, title, ready]
        default: select
  push:
    paths:
      - "e2e/**"
      - ".github/workflows/e2e-pages.yml"

permissions:
  contents: read

concurrency:
  group: e2e-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # デプロイが失敗したときは、古い版を確かめても意味が無いので走らせない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Unit tests
        run: python -m pytest e2e -q

      - name: Smoke (SwiftShader)
        env:
          KCD_E2E_URL: ${{ inputs.url }}
          UNTIL: ${{ inputs.until || 'select' }}
        run: >-
          python e2e/run_webgl_smoke.py --browser chromium --gl software
          --until "$UNTIL" --out build/e2e/ci

      - name: Upload screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: build/e2e/ci
          if-no-files-found: ignore
          retention-days: 14
