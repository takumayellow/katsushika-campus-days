<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>葛飾キャンパスデイズ</title>
    <!-- アイコンは外部ファイルを増やさないよう SVG を埋め込む。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312151b'/%3E%3Cpath d='M6 20l10-9 10 9v6H6z' fill='%233f7ad6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <h1 id="kcd-title">葛飾キャンパスデイズ</h1>

      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

        <!-- 読み込み中の帯。Unity の既定テンプレートと同じ仕組みで、絵は使わず CSS で描く。 -->
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-loading-text">読み込み中…</div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
          </div>
        </div>

        <!-- マウスがゲームに取られていない間だけ出す案内。全画面ボタンは画面の中に置くので、
             ブラウザの全画面表示（キャンバスだけが映る）でも隠れない (#48)。 -->
        <div id="kcd-overlay" class="kcd-hidden">
          <span id="kcd-overlay-text">クリックで操作開始　·　Esc でマウスを解放　·　F で全画面</span>
          <button type="button" class="kcd-fullscreen">⛶ 全画面</button>
        </div>
      </div>

      <div id="unity-warning"> </div>

      <div id="kcd-guide">
        <p class="kcd-line">クリックで操作開始　·　<b>Esc</b> でマウスを解放　·　<b>F</b> で全画面</p>
        <p class="kcd-line kcd-sub"><b>WASD</b> 移動　·　<b>Shift</b> ダッシュ　·　<b>E</b> 話す　·　<b>Tab</b> クエスト</p>
        <button type="button" class="kcd-fullscreen">⛶ 全画面</button>
      </div>
    </div>

    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");
      const overlay = document.querySelector("#kcd-overlay");
      const guide = document.querySelector("#kcd-guide");

      // 一時的な注意書き、または type=='error' のときはキャンバスの上に残るエラー表示。
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; color: #fff; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #f2c744; color: #12151b; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      // 各ファイル名は圧縮の設定（Gzip + 復元フォールバック）を含んだものがそのまま入る。
      // ローダーがサーバーの Content-Encoding が無い場合の展開まで面倒を見るので、ここは既定テンプレートと同じ形にしておく。
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",

        // 全画面にする要素。案内と全画面ボタンをこの中に入れてあるので、全画面でも操作できる。
        fullscreenElementID: "unity-fullscreen-container",

        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // スマホ・タブレットは画面いっぱいに広げる。
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      // マウスがゲームに取られている（ポインターロック）間は案内を消し、外れたら必ず出す。
      // ブラウザが Esc でロックを外したときにも呼ばれるので、全画面ボタンが押せる状態に戻る。
      function updateLockUi() {
        var locked = document.pointerLockElement === canvas;
        overlay.classList.toggle("kcd-hidden", locked);
        guide.classList.toggle("kcd-dim", locked);
      }
      document.addEventListener("pointerlockchange", updateLockUi);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "flex";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
          document.querySelectorAll(".kcd-fullscreen").forEach((button) => {
            button.onclick = () => { unityInstance.SetFullscreen(1); };
          });
          updateLockUi();
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
