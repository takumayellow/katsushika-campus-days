<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>葛飾キャンパスデイズ</title>
    <!-- アイコンは外部ファイルを増やさないよう SVG を埋め込む。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312151b'/%3E%3Cpath d='M6 20l10-9 10 9v6H6z' fill='%233f7ad6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- 次の行は tools/deploy_pages.py --build がビルド元のコミットと作業ツリーの状態を書いた
         <meta name="kcd-build"> に置き換える (#75)。 -->
    <!-- KCD_BUILD_STAMP -->
  </head>
  <body>
    <div id="unity-container">
      <h1 id="kcd-title">葛飾キャンパスデイズ</h1>

      <!-- 指だけで操作する端末（スマホ・タブレット）では、ゲームを読み込む前にこれを出す (#73)。
           操作はキーボードとマウス、またはゲームパッドだけで、タッチ操作は作っていない。
           「それでも読み込む」を押すまで Build/ のファイルは取りに行かない。 -->
      <section id="kcd-pc-only" hidden>
        <h2 id="kcd-pc-only-title">PC 向けのゲームです</h2>
        <p>キーボードとマウス、またはゲームパッドで操作します。タッチ操作には対応していないので、この端末では歩き回れません。</p>
        <p>PC のブラウザで次のアドレスを開いてください。<br><span id="kcd-pc-only-url"></span></p>
        <p class="kcd-sub">読み込むと数十 MB の通信があります。</p>
        <button type="button" id="kcd-pc-only-continue">それでも読み込む</button>
      </section>

      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

        <!-- 読み込み中の帯。Unity の既定テンプレートと同じ仕組みで、絵は使わず CSS で描く。 -->
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-loading-text">読み込み中…</div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
          </div>
        </div>

        <!-- マウスが解放された直後と、解放中にマウスを動かしたときだけ数秒出す案内。
             全画面ボタンは画面の中に置くので、ブラウザの全画面表示（キャンバスだけが
             映る）でも隠れない (#48)。キーボードはクリックしなくても最初から効く。 -->
        <div id="kcd-overlay" class="kcd-hidden">
          <span id="kcd-overlay-text">クリックでマウス視点　·　Esc でマウスを解放　·　F で全画面</span>
          <button type="button" class="kcd-fullscreen">⛶ 全画面</button>
        </div>
      </div>

      <div id="unity-warning"> </div>

      <div id="kcd-guide">
        <p class="kcd-line">クリックでマウス視点　·　<b>Esc</b> でマウスを解放　·　<b>F</b> で全画面</p>
        <p class="kcd-line kcd-sub"><b>WASD</b> 移動　·　<b>Shift</b> ダッシュ　·　<b>E</b> 話す　·　<b>Tab</b> クエスト</p>
        <button type="button" class="kcd-fullscreen">⛶ 全画面</button>
      </div>

      <!-- どのコミットから作ったビルドか。不具合の報告で版を言えるよう, 隅に小さく出す (#75)。 -->
      <p id="kcd-build" hidden></p>
    </div>

    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");
      const overlay = document.querySelector("#kcd-overlay");
      const guide = document.querySelector("#kcd-guide");

      // deploy_pages.py が書いたビルド元の記録を, ページの隅に短く出す。記録が無ければ出さない。
      (function showBuildStamp() {
        const meta = document.querySelector('meta[name="kcd-build"]');
        const match = meta && /commit=([0-9a-f]{7})[0-9a-f]* tree=(\w+)/.exec(meta.content);
        if (!match) return;
        const label = document.querySelector("#kcd-build");
        label.textContent = "build " + match[1] + (match[2] === "clean" ? "" : " (" + match[2] + ")");
        label.title = meta.content;
        label.hidden = false;
      })();

      // 一時的な注意書き、または type=='error' のときはキャンバスの上に残るエラー表示。
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; color: #fff; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #f2c744; color: #12151b; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      // 各ファイル名は圧縮の設定（Gzip + 復元フォールバック）を含んだものがそのまま入る。
      // ローダーがサーバーの Content-Encoding が無い場合の展開まで面倒を見るので、ここは既定テンプレートと同じ形にしておく。
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",

        // 全画面にする要素。案内と全画面ボタンをこの中に入れてあるので、全画面でも操作できる。
        fullscreenElementID: "unity-fullscreen-container",

        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      const container = document.querySelector("#unity-container");

      // 指だけで操作する端末か (#73)。主な入力が粗いポインタでホバーできず、マウスやペンの
      // ような細かいポインタが 1 つも無いもの。iPadOS の Safari は UA が Mac を名乗るが、
      // これなら拾える。マウスをつないだタブレットは細かいポインタがあるので止めない。
      function isTouchOnly() {
        if (!window.matchMedia) return false;
        return matchMedia("(pointer: coarse)").matches
          && matchMedia("(hover: none)").matches
          && !matchMedia("(any-pointer: fine)").matches;
      }

      function applyMobileLayout() {
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || isTouchOnly()) {
          // スマホ・タブレットは画面いっぱいに広げる。
          container.classList.add("unity-mobile");
          canvas.classList.add("unity-mobile");
        }
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      // キャンバスの中の案内は出しっぱなしにしない。以前は「ロックされていない間はずっと」
      // 出していたので、キーボードだけで遊んでいる間やタイトル・メニュー（ゲームが自分で
      // ロックを外す）のあいだ、いつまでも「クリックで操作開始」が画面に被っていた。
      // いまは、ロックが外れた直後と、外れている間にマウスを動かしたときだけ数秒出す。
      const OVERLAY_MS = 3500;
      let overlayTimer = 0;
      function isLocked() { return document.pointerLockElement === canvas; }
      function showOverlayBriefly() {
        if (isLocked()) return;
        overlay.classList.remove("kcd-hidden");
        clearTimeout(overlayTimer);
        overlayTimer = setTimeout(() => overlay.classList.add("kcd-hidden"), OVERLAY_MS);
      }
      function hideOverlay() {
        clearTimeout(overlayTimer);
        overlay.classList.add("kcd-hidden");
      }
      function updateLockUi() {
        var locked = isLocked();
        guide.classList.toggle("kcd-dim", locked);
        if (locked) hideOverlay(); else showOverlayBriefly();
      }
      document.addEventListener("pointerlockchange", updateLockUi);
      // 全画面ボタンに手を伸ばすときに出るよう、解放中のマウス移動で出し直す。
      fullscreenContainer.addEventListener("mousemove", showOverlayBriefly);
      // キーを押して遊び始めたら邪魔しない。
      document.addEventListener("keydown", hideOverlay);

      // キーボードはキャンバスにフォーカスがあるときだけゲームに届く。読み込みが終わったら
      // こちらでフォーカスを入れ、クリックしなくても WASD で動けるようにする。ページの余白や
      // 全画面ボタンを押してフォーカスが外れても、次のキー入力でキャンバスへ戻す。
      function focusCanvas() {
        if (document.activeElement !== canvas) canvas.focus({ preventScroll: true });
      }

      // ローダーを差し込んでゲームを読み込む。ここを呼ぶまで Build/ のファイルは取りに行かない。
      function startLoading() {
        applyMobileLayout();
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          const loadingContainer = document.querySelector("#unity-loading-container");
          const progressBarFull = document.querySelector("#unity-progress-bar-full");

          createUnityInstance(canvas, config, (progress) => {
            if (progress < 1) {
              loadingContainer.style.display = "flex";
              progressBarFull.style.width = 100 * progress + "%";
            } else {
              loadingContainer.style.display = "none";
            }
          }).then((unityInstance) => {
            document.querySelectorAll(".kcd-fullscreen").forEach((button) => {
              button.onclick = () => { unityInstance.SetFullscreen(1); focusCanvas(); };
            });
            focusCanvas();
            document.addEventListener("keydown", (e) => {
              if (e.target === document.body || e.target === document.documentElement) {
                focusCanvas();
              }
            }, true);
          }).catch((message) => {
            unityShowBanner(message, 'error');
          });
        };

        document.body.appendChild(script);
      }

      // 指だけの端末では、案内を出して「それでも読み込む」を待つ (#73)。
      if (isTouchOnly()) {
        const pcOnly = document.querySelector("#kcd-pc-only");
        document.querySelector("#kcd-pc-only-url").textContent = location.href.split("#")[0];
        container.classList.add("kcd-gated");
        pcOnly.hidden = false;
        document.querySelector("#kcd-pc-only-continue").addEventListener("click", () => {
          pcOnly.hidden = true;
          container.classList.remove("kcd-gated");
          startLoading();
        }, { once: true });
      } else {
        startLoading();
      }
    </script>
  </body>
</html>
